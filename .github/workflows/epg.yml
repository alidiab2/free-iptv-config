# Builds the programme guide (epg.json) from free XMLTV feeds twice a day and publishes it on the
# `epg` branch as a single commit (force-pushed, so the repo doesn't grow). The app reads
# https://raw.githubusercontent.com/alidiab2/free-iptv-config/epg/epg.json
name: EPG

on:
  schedule:
    - cron: '17 2,14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['epg/**', '.github/workflows/epg.yml']

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build epg.json
        run: mkdir out && python3 epg/build.py out/epg.json epg/aliases.json epg/channels.txt
      - name: Publish to the epg branch
        working-directory: out
        run: |
          git init -q -b epg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.json
          git commit -q -m "EPG $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" epg
